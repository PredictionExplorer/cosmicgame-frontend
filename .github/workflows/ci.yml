name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules and .next/cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            .next/cache
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Audit high-severity dependencies
        run: npm run audit:high
        continue-on-error: true

      - name: Run lint
        run: npm run lint

      - name: Enforce complete i18n catalog parity
        run: npm run i18n:strict

      - name: Enforce Sprint 1 Chinese catalog coverage
        run: npm run i18n:sprint1

      - name: Enforce Sprint 2 Chinese catalog coverage
        run: npm run i18n:sprint2

      - name: Enforce Sprint 3 Chinese catalog coverage
        run: npm run i18n:sprint3

      - name: Enforce Sprint 4 Chinese catalog coverage
        run: npm run i18n:sprint4

      - name: Enforce Sprint 5 Chinese catalog coverage
        run: npm run i18n:sprint5

      - name: Enforce Sprint 6 Chinese catalog coverage
        run: npm run i18n:sprint6

      - name: Enforce Sprint 7 Chinese catalog coverage
        run: npm run i18n:sprint7

      - name: Enforce canonical Chinese terminology
        run: npm run terminology:check

      - name: Enforce English and Chinese lexicon
        run: npm run lexicon:scan

      - name: Type check
        run: npm run type-check

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Build
        run: npm run build

      - name: Enforce app-home bundle budget
        run: npm run bundle:budget

  e2e:
    runs-on: ubuntu-latest
    needs: lint-test-build
    env:
      # The harness tier has its own job below (it needs Docker, Go, and the
      # sibling repos); this job runs the mocked-API projects only.
      HARNESS_E2E: '0'
      NEXT_PUBLIC_PLAYWRIGHT_UX_SCENARIOS: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules and .next/cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            .next/cache
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      # WebKit backs the Mobile Safari project, which runs the mobile layout
      # audits. iOS Safari is where most mobile-only layout bugs actually
      # appear, and Chromium does not reproduce them.
      - name: Install Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Install Playwright deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: Build and start server
        run: |
          npm run build
          npm run start &
          npx wait-on http://localhost:3000 --timeout 60000

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: |
            playwright-report
            test-results
          retention-days: 7

  # Full-stack tier: real contracts on a local chain + the real indexer/API,
  # driven by the harness director (scripts/harness, docs/harness.md). The
  # sibling repos are pinned in harness.lock.json; bumping that file is the
  # deliberate, reviewed way to pick up contract or backend changes.
  #
  # If the sibling repositories are private, add a read-scoped PAT as the
  # SIBLING_REPOS_TOKEN secret; for public repos the default token suffices.
  harness-e2e:
    runs-on: ubuntu-latest
    needs: lint-test-build
    env:
      COSMIC_CONTRACTS_DIR: ${{ github.workspace }}/.siblings/Cosmic-Signature
      RWCG_BACKEND_DIR: ${{ github.workspace }}/.siblings/augur-explorer
    steps:
      - uses: actions/checkout@v4

      - name: Read harness lock
        id: lock
        run: |
          echo "contracts_repo=$(node -p "require('./harness.lock.json').contracts.repository")" >> "$GITHUB_OUTPUT"
          echo "contracts_ref=$(node -p "require('./harness.lock.json').contracts.ref")" >> "$GITHUB_OUTPUT"
          echo "backend_repo=$(node -p "require('./harness.lock.json').backend.repository")" >> "$GITHUB_OUTPUT"
          echo "backend_ref=$(node -p "require('./harness.lock.json').backend.ref")" >> "$GITHUB_OUTPUT"

      - name: Check out contracts repo (pinned)
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.lock.outputs.contracts_repo }}
          ref: ${{ steps.lock.outputs.contracts_ref }}
          path: .siblings/Cosmic-Signature
          token: ${{ secrets.SIBLING_REPOS_TOKEN || github.token }}

      - name: Check out backend repo (pinned)
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.lock.outputs.backend_repo }}
          ref: ${{ steps.lock.outputs.backend_ref }}
          path: .siblings/augur-explorer
          token: ${{ secrets.SIBLING_REPOS_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Go (backend toolchain)
        uses: actions/setup-go@v5
        with:
          go-version-file: .siblings/augur-explorer/go.mod
          cache-dependency-path: .siblings/augur-explorer/go.sum

      - name: Install frontend dependencies
        run: npm ci

      - name: Install contracts repo dependencies
        run: npm ci
        working-directory: .siblings/Cosmic-Signature

      - name: Cache solc and contract artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.solc-select
            .siblings/Cosmic-Signature/artifacts
            .siblings/Cosmic-Signature/cache
          key: harness-solc-${{ runner.os }}-${{ steps.lock.outputs.contracts_ref }}

      - name: Install solc 0.8.34 (contracts compiler)
        run: |
          pipx install solc-select || pip install --user solc-select
          solc-select install 0.8.34
          solc-select use 0.8.34

      - name: Build backend binaries
        run: make build
        working-directory: .siblings/augur-explorer

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: harness-playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright (chromium)
        if: steps.harness-playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright deps only
        if: steps.harness-playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run harness e2e tests
        run: npm run test:e2e:harness

      - name: Upload harness logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harness-logs
          path: |
            .harness/logs
            playwright-report
          retention-days: 7
